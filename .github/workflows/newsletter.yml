name: Weekly AI Newsletter

on:
  schedule:
    # Every Monday, 05:00 UTC = 10:30 AM IST
    - cron: "0 5 * * 1"
  workflow_dispatch: {}   # allows manual "Run workflow" trigger for testing

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main.py

      - name: Commit updated send history
        run: |
          git config user.name "abakus-newsletter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs/send_history.json
          git diff --staged --quiet || git commit -m "Update send history [skip ci]"
          git push
